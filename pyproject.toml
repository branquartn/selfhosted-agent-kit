[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfhosted-agent-kit"
version = "1.1.0"
description = "Self-hosted AI agent with tool use, streaming web UI and long-term memory. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Source-available (see LICENSE and LICENSE-COMMERCIAL.md)" }
dependencies = []

[project.scripts]
selfhosted-agent = "agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
