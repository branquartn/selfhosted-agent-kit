[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfhosted-agent-kit"
version = "1.1.0"
description = "Self-hosted AI agent — demo edition (read-only tools). Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Evaluation / non-commercial (see LICENSE)" }
dependencies = []

[project.scripts]
selfhosted-agent = "agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
